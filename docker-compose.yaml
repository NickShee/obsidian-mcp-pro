name: ob-mcp-pro-nick

# ============================================================
# obsidian-mcp-pro — 源码 + 部署合一（工作目录 /docker/ob-mcp-pro-nick）
#
#   构建： docker compose build
#          （等价 docker build -t ghcr.io/nickshee/obsidian-mcp-pro:nick-customized .）
#   启动： docker compose up -d
#   变量： 见同目录 .env（vault 路径 / token / embedding key）
#
# 镜像 tag 约定：nick-customized
#
# 注：不使用 env_file，所有容器变量都在下面 environment 里显式列明，
#     避免 .env 里的其它密钥被无差别注入容器。
# ============================================================

services:
  ob-mcp-pro-nick:
    build: .
    image: ghcr.io/nickshee/obsidian-mcp-pro:nick-customized
    container_name: ob-mcp-pro-nick
    restart: unless-stopped
    networks:
      - lobehub_lobe-net
    ports:
      - "3336:3333"
    volumes:
      - ${VAULT_PATH_MAIN}:/vault
    environment:
      TZ: Asia/Shanghai
      OBSIDIAN_VAULT_PATH: /vault
      MCP_HTTP_TOKEN: ${MCP_HTTP_TOKEN_MAIN}
      LOG_LEVEL: info
      LOG_FORMAT: text
      OBSIDIAN_READ_PATHS: .

      # SSE keep-alive 心跳（stateful 模式防断联；stateless 下自动失效，无副作用）
      SSE_KEEPALIVE_ENABLED: "true"
      SSE_KEEPALIVE_INTERVAL_MS: "15000"

      # 传输模式（二选一）
      #   "false" = stateful + SSE 心跳：session 管理 + 长连接保活，兼容所有客户端
      #   "true"  = stateless：无 session/长连接，每次请求独立，彻底免疫反代断联（治本）
      # 修改后需重启容器生效；切换后需在 LobeHub 重新同步该 MCP
      STATELESS_MODE: "true"

      # 语义搜索
      OBSIDIAN_EMBEDDING_PROVIDER: openai
      OBSIDIAN_EMBEDDING_MODEL: qwen3.7-text-embedding
      OBSIDIAN_EMBEDDING_URL: https://ws-l854rski6nm3j0si.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      OBSIDIAN_EMBEDDING_API_KEY: ${OBSIDIAN_EMBEDDING_API_KEY}

      # 新建笔记的默认 frontmatter（可选）：作为最底层「只补缺失」，绝不覆盖已有键
      #   - 已有 frontmatter：只追加缺失键，原有键的值/顺序/注释/引号逐字节不动
      #   - 无 frontmatter：补一个完整默认块
      #   - create_note 额外写入服务端本地日期的 created；append/prepend 回填旧笔记时不写 created
      # 取消注释即启用；不启用时写入行为与以前逐字节一致
      # OBSIDIAN_DEFAULT_FRONTMATTER: '{"tags":[],"status":"draft","aliases":[]}'
    command:
      - "--transport=http"
      - "--host=0.0.0.0"
      - "--port=3333"
      - "--rate-limit=600"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  lobehub_lobe-net:
    external: true
